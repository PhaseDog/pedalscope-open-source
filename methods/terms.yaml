# The methods documents' terms source (#305). Every \term{key} a chapter
# uses must be defined here, and every entry here must be used by some
# chapter — test_terms.py enforces both. Fields are LaTeX source text
# (inline math allowed); `symbol` is LaTeX math or empty. `technical` is
# the definition the technical document prints, `plain` the one the lay
# companion prints. Neither may say what anything sounds like.
terms:
  - key: manifest
    term: methods manifest
    technical: >-
      A machine-readable JSON file, emitted by the shipped measurement kernel
      through \texttt{analysisdump manifest}, listing every parameter that
      determines a measurement's result --- each value obtained by calling the
      function that owns it. The documents' tables are generated from it and
      CI fails when the committed copy drifts from a fresh one.
    plain: >-
      The list of every setting the app uses to make a measurement, written out
      by the app's own code so that it cannot be typed wrongly. The documents
      read their numbers from it.

  - key: parity
    term: parity test
    technical: >-
      A continuous-integration test that runs the shipped code and the
      independent Python reimplementation on identical synthetic devices and
      asserts, at every valid point, agreement between the two to a stated
      tolerance and agreement of both with analytic ground truth to a stated
      tolerance.
    plain: >-
      A check, run automatically on every change, that a second, independently
      written program gets the same answer as the app --- and that both get the
      right answer on devices whose behaviour is known exactly.

  - key: sweep
    term: synchronized swept sine
    symbol: $x(t)$
    technical: >-
      A sine whose frequency rises exponentially from $f_1$ to $f_2$ over the
      duration $T$, with its rate constant chosen so that $f_1 L$ is an
      integer; under that condition each harmonic a memoryless device generates
      is an exact time-advanced copy of the sweep, advanced by $L\ln k$.
    plain: >-
      A test tone that glides smoothly from low to high pitch, timed so that the
      distortion each note produces can be picked apart afterwards.

  - key: rate-constant
    term: rate constant
    symbol: $L$
    technical: >-
      The time in seconds over which the sweep's instantaneous frequency grows
      by a factor of $e$: $f(t) = f_1 e^{t/L}$. Fixed by the synchronization
      condition from the requested duration.
    plain: >-
      How quickly the test tone climbs; a larger value means a slower, longer
      sweep.

  - key: synchronization
    term: synchronization condition
    technical: >-
      The requirement that $f_1 L$ be an integer, met by rounding the rate
      constant; it makes the sweep's phase at every harmonic's arrival a whole
      number of cycles, so harmonic responses separate with meaningful phase.
    plain: >-
      A small adjustment to the sweep's length so that the arithmetic that
      separates the harmonics works out exactly.

  - key: instantaneous-frequency
    term: instantaneous frequency
    symbol: $f(t)$
    technical: >-
      The frequency the sweep is passing through at time $t$:
      $f(t) = f_1 e^{t/L}$, the derivative of the phase divided by $2\pi$.
    plain: >-
      The pitch the test tone is at, at a given moment.

  - key: excited-band
    term: excited band
    technical: >-
      The range of fundamentals the sweep drove at full amplitude: from the
      instantaneous frequency where the fade-in ends to the one where the
      fade-out begins. Outside it the device was driven under a ramp and a read
      describes the measurement, not the device.
    plain: >-
      The range of notes the test tone actually played at full strength; the
      very first and very last moments are ramped and do not count.

  - key: fundamental
    term: fundamental
    symbol: $f_0$
    technical: >-
      The excitation frequency whose harmonics are being read; in a swept
      measurement every $f_0$ in the band is excited in turn, and the $k$-th
      harmonic of $f_0$ is read at the output frequency $k f_0$.
    plain: >-
      The note being played. Distortion shows up as extra tones at whole-number
      multiples of it.

  - key: harmonic-order
    term: harmonic order
    symbol: $k$
    technical: >-
      The integer multiple of the fundamental at which a harmonic sits; order 1
      is the fundamental itself. Odd orders are produced by symmetric
      nonlinearities, even orders require asymmetry.
    plain: >-
      Which multiple of the note an added tone is: twice the note is the second
      harmonic, three times is the third, and so on.

  - key: clipping
    term: clipping
    technical: >-
      A memoryless nonlinearity that limits the output amplitude: the output
      follows the input up to a threshold and is compressed or held beyond it
      (hard: a corner into a flat ceiling; soft: a gradual bend). An
      odd-symmetric clipper produces odd harmonics only; any asymmetry between
      the two half-cycles adds even harmonics.
    plain: >-
      What a distortion circuit does to a note that is too big for it: the
      peaks of the wave are flattened or rounded off. A wave whose shape has
      changed is, by the same token, a wave with new harmonics in it.

  - key: harmonic-response
    term: harmonic response
    symbol: $H_k(f)$
    technical: >-
      The complex, input-normalized amplitude with which the device emits
      energy at output frequency $f$ as its $k$-th harmonic; the harmonic of a
      fundamental $f_0$ is read at $f = k f_0$.
    plain: >-
      For each multiple of the note, how much of it the device adds, across the
      whole range of notes.

  - key: harmonic-pulse
    term: harmonic pulse
    technical: >-
      In the deconvolved response, the impulse response belonging to one
      harmonic order, arriving $L \ln k$ seconds before the linear one; each
      is cut out with its own window.
    plain: >-
      After the analysis untangles the recording, each harmonic shows up as its
      own separate blip, spaced apart in time so it can be measured alone.

  - key: deconvolution
    term: deconvolution
    technical: >-
      Dividing the captured response's spectrum by the sweep's spectrum ---
      here, multiplying by the analytic inverse filter --- to recover the
      device's impulse response, in which the harmonic pulses appear at their
      time advances.
    plain: >-
      The step that undoes the sweep, turning the recording into a set of
      separate blips, one per harmonic.

  - key: inverse-filter
    term: inverse filter
    symbol: $\tilde X^{-1}(f)$
    technical: >-
      The closed-form stationary-phase inverse of the synchronized sweep,
      $2\sqrt{f/L}\,\exp(j(\pi/4 - 2\pi f L (1 - \ln(f/f_1))))$, tapered to
      zero below $f_1$; using the closed form extrapolates the phase law
      above $f_2$, so harmonics above the sweep's top deconvolve cleanly.
    plain: >-
      The exact mathematical undo of the test tone, written down from its
      formula rather than measured, so it keeps working above the highest note
      the tone reached.

  - key: impulse-response
    term: impulse response
    symbol: $h[n]$
    technical: >-
      The deconvolved response, circular over the analysis length $N$: the
      linear pulse at index 0 and order $k$'s pulse at
      $N - \mathrm{round}(L \ln k \cdot f_s)$.
    plain: >-
      The device's fingerprint in time: a sharp blip for the note itself and
      earlier, smaller blips for each harmonic.

  - key: extraction-window
    term: extraction window
    symbol: $T_k$
    technical: >-
      The raised-cosine window that cuts order $k$'s pulse out of the impulse
      response; its half-widths are half the gap to each neighbouring pulse,
      capped, and its duration sets the order's spectral resolution.
    plain: >-
      The slice of time around one harmonic's blip that is kept for measuring
      it; wide enough to hold the blip, narrow enough to exclude its
      neighbours.

  - key: input-normalized
    term: input-normalized
    technical: >-
      Divided by the sweep amplitude $A$, so that a unit-gain linear device
      reads $H_1 = 1$ (0 dB) and every $H_k$ is a ratio to the input, not an
      absolute level.
    plain: >-
      Measured relative to the strength of the test tone, so that the numbers
      compare across drive levels and rigs.

  - key: validity-bound
    term: validity bound
    technical: >-
      Where a harmonic read is trustworthy: $f_1 \le f_0 \le f_2$ and
      $f_0 \le f_s/(2k+1)$ (the alias-image bound), plus $f_0 \le
      f_{\mathrm{cal}}/k$ on a compensated record. Reads outside it are
      excluded from every fit, feature, summary and comparison.
    plain: >-
      The range of notes over which a given harmonic can be measured honestly;
      beyond it the recording itself gets in the way.

  - key: alias-image
    term: alias image
    technical: >-
      Content above half the sample rate folds back below it in a sampled
      capture; order $k+1$'s image collides with the read of order $k$ once
      $f_0 > f_s/(2k+1)$.
    plain: >-
      A recording cannot hold tones above half its sample rate; higher ones
      fold back down and can land on a harmonic being measured.

  - key: thd
    term: total harmonic distortion
    symbol: $\mathrm{THD}$
    technical: >-
      $\sqrt{\sum_{k \ge 2} |H_k(k f_0)|^2} / |H_1(f_0)|$ over the orders that
      are in the audible band and pass the validity bound --- THD, not THD+N;
      undefined where the fundamental is not present.
    plain: >-
      The size of everything the device added at multiples of the note,
      compared with the note itself, as a single number.

  - key: floor
    term: measurement floor
    technical: >-
      The level below which a read is the rig rather than the device, derived
      at read time from the embedded calibration's pooled distortion stamp
      with per-track, drive and averaging adjustments; a read at or below it
      is reported as a bound.
    plain: >-
      How quiet a measurement can go before it is measuring the recording
      equipment instead of the pedal; numbers at that level are stated as
      limits, not values.

  - key: fundamental-presence
    term: fundamental presence
    technical: >-
      Whether $H_1(f_0)$ is a measurement at all: absent when it sits at or
      beyond the analyzer's measured separation bound below the loudest valid
      in-band order, or at or below its rig-floor margin. Where absent, no
      ratio to it is quoted.
    plain: >-
      A check that the note itself is still there in the output; if a device
      removes the note, ratios to it mean nothing and the app says so.

  - key: shaping
    term: harmonic shaping
    technical: >-
      The read-time predicate deciding whether a harmonic read is content the
      circuit deterministically shaped or noise that landed in that order's
      window, from the coherence of the complex response along frequency.
    plain: >-
      A check that a measured harmonic is really the circuit's doing and not
      just the device's hiss showing up where a harmonic would be.

  - key: coherence
    term: coherence
    symbol: $\Gamma$
    technical: >-
      $|\sum_i z_i| / \sum_i |z_i|$ over lagged products
      $z_i = H(b_i + \mathrm{lag})\,\overline{H(b_i)}$: shaped content is a
      phasor whose phase advances smoothly with frequency, noise scatters
      isotropically, and the statistic is $1/\sqrt n$ for pure noise.
    plain: >-
      A score for how orderly a harmonic's measurement is across neighbouring
      frequencies; real circuit behaviour is orderly, noise is not.

  - key: scatter
    term: read scatter
    technical: >-
      The one-sigma uncertainty, in dB, of a magnitude read at its estimated
      signal-to-noise ratio --- the Rician mean-of-dB statistic, pinned by a
      Monte-Carlo table and saturating at the pure-noise value.
    plain: >-
      How far a single measured level might be off simply because of noise,
      stated alongside the level.

  - key: averaging
    term: sweep averaging
    technical: >-
      Combining $N$ back-to-back sweeps from one capture by complex, bin-wise
      averaging of their harmonic responses after each repeat is derotated by
      its fitted capture delay; the noise power falls as $1/N$ where the
      residual is noise, and magnitudes are never averaged.
    plain: >-
      Playing the sweep several times in a row and combining the results so
      that random noise partly cancels while the device's behaviour adds up.

  - key: derotation
    term: derotation
    technical: >-
      Multiplying every harmonic response by $e^{+j 2\pi f \delta / f_s}$ on
      its own output-frequency axis to remove a capture delay $\delta$ --- a
      unity-magnitude rotation, so magnitudes are untouched at every bin.
    plain: >-
      Lining up repeated sweeps to the fraction of a sample before combining
      them, so that a tiny timing drift cannot smear the result.

  - key: tanh
    term: tanh
    technical: >-
      The hyperbolic tangent, as the saturating function $y = \tanh(g x)$:
      linear for small inputs and
      bending smoothly toward $\pm 1$, which it never reaches --- the
      textbook soft clipper. It is odd-symmetric, so it produces odd
      harmonics only, and its ladder falls off steeply with order. The
      worked example throughout these documents is $\tanh(2x)$ at a sweep
      amplitude of $0.5$, whose exact harmonic amplitudes are computed by
      quadrature.
    plain: >-
      The hyperbolic tangent, the textbook soft clipper: a smooth S-shaped
      curve that passes small
      signals through unchanged and bends ever more gently toward a ceiling
      it never quite reaches. It clips the top and bottom of the wave alike,
      so it adds only odd harmonics, and they fall away quickly. The worked
      example in these documents is this curve with the input doubled first.

  - key: phantom
    term: phantom capture
    technical: >-
      A synthetic capture $\sum_k m_k A \sin(k\varphi(t))$ built from the
      sweep's own phase law, so that its $k$-th harmonic response is exactly
      $m_k$ by construction, with no content above the listed orders and no
      aliasing; the oracle's exact case.
    plain: >-
      A made-up recording whose distortion is known to the digit, used to
      check that the analysis reads back exactly what was put in.

  - key: decibel
    term: decibel
    symbol: dB
    technical: >-
      A logarithmic ratio: $20\log_{10}$ of an amplitude ratio (equivalently
      $10\log_{10}$ of a power ratio). $+6\dB$ doubles an amplitude, $-20\dB$
      is one tenth, $-40\dB$ one hundredth; the reference is named by a
      suffix or by context.
    plain: >-
      A way of writing how much bigger or smaller one level is than another,
      on a scale where each step of 20 is a factor of ten in size: 0 means the
      same, $-20$ means a tenth as big, $-40$ a hundredth, $-60$ a thousandth.

  - key: dbfs
    term: dBFS
    technical: >-
      Decibels relative to digital full scale: $20\log_{10}$ of a linear
      amplitude in which $1.0$ is the largest value the converter or file can
      represent.
    plain: >-
      A level relative to the loudest a digital recording can be; 0 is the
      maximum and negative numbers are quieter.

  - key: dbc
    term: dBc
    technical: >-
      Decibels relative to a carrier --- here the fundamental, or the louder of
      two played tones --- so that a product's level is stated as a ratio to the
      signal that produced it.
    plain: >-
      A level relative to the note (or tone) that caused it, so that ``how big
      is the distortion'' does not depend on how loud the test was.

  # --- Transfer Curve (#306) ------------------------------------

  - key: transfer-curve
    term: transfer curve
    technical: >-
      The X--Y figure of a device under a steady low-frequency sine:
      instantaneous output against instantaneous input over one
      phase-averaged cycle. A memoryless device retraces a single curve;
      linear filter phase and genuine memory open it into a loop.
    plain: >-
      A picture of what comes out against what went in, drawn while one
      steady low note plays: a pedal with no memory draws one line, and a
      loop means the output depends on where the signal has been as well.

  - key: averaged-cycle
    term: averaged cycle
    technical: >-
      The stimulus and the capture folded onto one period of the drive note
      in $n$ equal phase bins, each bin holding the mean of every sample
      whose phase fell in it, from the skipped opening cycles to the end of
      the tone; the figure's two coordinates are the two bins' means.
    plain: >-
      Every cycle of the note laid on top of the previous ones and averaged,
      so that noise cancels and the shape stays --- the figure is drawn from
      that one averaged cycle.

  - key: static-curve
    term: static curve
    technical: >-
      The output-versus-input estimate that ignores the loop: the cycle is
      split at the input's extremes into a rising and a falling branch, each
      is interpolated onto a common input grid, and the two are averaged ---
      never binned by input value.
    plain: >-
      The single line drawn through the middle of a loop, taken as the
      device's clipping shape: the upward and downward passes averaged
      together.

  - key: box-normalization
    term: box normalization
    technical: >-
      Every loop area is divided by $4\,x_{\max}\,y_{\max}$, the rectangle
      that bounds the figure, so the areas are dimensionless and a pure
      ellipse from a phase shift $\varphi$ reads $(\pi/4)\,|\sin\varphi|$.
    plain: >-
      Loop areas are stated as a fraction of the box the whole figure fits
      in, so a tiny signal and a loud one are on the same scale.

  - key: lobe-area
    term: unsigned lobe area
    technical: >-
      The total loop area: the closed trajectory is split at every
      self-crossing and the absolute area of every lobe is summed, so
      opposite-winding lobes add instead of cancelling; lobes under a floor
      fraction of the box are dropped as bin noise.
    plain: >-
      How much area the loop encloses, counted lobe by lobe regardless of
      which way each lobe is traced --- a figure-eight counts twice, not
      zero.

  - key: fundamental-ellipse
    term: fundamental ellipse
    technical: >-
      The least-squares ellipse through the trajectory: the projection of
      both cycles onto the fundamental. Its area is the linear-phase loop
      --- what a filter's rotation of the fundamental contributes, never
      memory.
    plain: >-
      The smooth oval a plain tone filter draws by shifting the note in time:
      real, and not memory, so it is measured separately and subtracted.

  - key: nonlinear-loop-area
    term: nonlinear loop area
    technical: >-
      The unsigned lobe area of the residual trajectory after the fundamental
      ellipse's output is subtracted --- the harmonic content's own lobes,
      the headline memory figure the verdict is taken on.
    plain: >-
      The loop that is left once the tone filter's oval is taken away: the
      part only a real memory effect (or a filter ahead of the clipper, see
      the phase removal) can draw.

  - key: phase-removal
    term: phase removal
    technical: >-
      The \S\,6.5 correction: the capture's harmonic phases are fitted against
      the paired Harmonic Distortion record's branch phases with one frame
      shift, each harmonic's burden over the memoryless lattice is folded out
      sequentially, and the correction is applied as a full-band
      unity-magnitude all-pass, so filter phase before and after the clipper
      is removed and only unpredicted phase --- memory evidence --- remains.
    plain: >-
      Using the pedal's own measured harmonic timing to undo what its tone
      filters did to the picture, so that what is left open is memory and not
      filtering.

  - key: frame-fit
    term: frame fit
    technical: >-
      The single time shift $\Delta l$ between the transfer capture's
      alignment and the paired record's, found by maximizing the
      magnitude-weighted phase coherence of every fittable harmonic; its
      residual over the harmonics is the pairing statistic.
    plain: >-
      Lining the two measurements up in time by one shift that makes every
      harmonic agree at once; how well they then agree says whether the two
      records really describe the same device at the same setting.

  - key: lattice
    term: memoryless lattice
    technical: >-
      The set of harmonic phases $\{0, \pi\}$ (in the cycle's convention,
      after the Novák factor $(k-1)\pi/2$) at which a memoryless device's
      harmonics sit; each measured harmonic's excess over its nearest
      lattice point, folded consistently from low order to high, is the
      filter burden the removal takes out.
    plain: >-
      The two positions a harmonic can sit in, relative to the note, in a pedal
      with no memory and no filtering: exactly in step with it, or exactly
      reversed. How far each measured harmonic sits from the nearer of the two
      is what the filters added, and the removal takes that out.

  - key: pairing-residual
    term: pairing residual
    technical: >-
      The magnitude-weighted RMS phase residual, in radians, over the
      harmonics of order two and above after the frame fit; a genuine pairing
      sits well under the accept bar and a record of another session or
      setting, or a device whose harmonics have no fundamental-anchored
      phase relationship, does not.
    plain: >-
      A single number for how well the two records agree once lined up; too
      large, and the app declines to apply the correction and says so.

  - key: polarity
    term: polarity
    technical: >-
      Whether the device inverts: read from the paired record's $H_1$ as the
      energy-weighted mean unit phasor over the low band, whose real part is
      the confidence (a quadrature response is coherent yet polarity-mute);
      stated on the figure only when the frame fit confirms the pairing.
    plain: >-
      Whether the pedal turns the wave upside down. Stated only when the
      measurement is sure; otherwise nothing is claimed.

  - key: orientation
    term: orientation resolution
    technical: >-
      A plugin-path capture is aligned by correlation against a tone and may
      land half a cycle off; when the cycle's fundamental phase sits on the
      $\{0,\pi\}$ lattice and the paired polarity confidently disagrees, the
      output cycle is advanced half a period, restoring the true
      input--output pairing.
    plain: >-
      A check that the picture is the right way up: a plugin measurement can
      come out upside down, and the pedal's own measured polarity is used to
      turn it back.

  - key: coupling-capacitor
    term: coupling capacitor
    technical: >-
      A series capacitor at a device's output: a first-order high-pass whose
      corner sits far below the probe note, so it removes the output's mean
      and leaves every harmonic's magnitude essentially untouched --- an
      asymmetric clipper's unequal clip levels are centred by it while its
      even harmonics survive.
    plain: >-
      The capacitor every pedal has on its output. It removes the wave's
      average level, so a clipper that clips the top and bottom at different
      heights shows equal heights after it --- but the even harmonics that
      asymmetry makes are still there.

  - key: alignment-error
    term: residual alignment error
    technical: >-
      Any difference between the integer loop latency removed before binning
      and the true delay, in samples; it rotates the output's fundamental by
      $2\pi f_0 e/f_s$ and harmonic $k$ by $k$ times that, opening the figure
      into a phase loop that grows with the note.
    plain: >-
      A leftover timing error between the test signal and the recording of a
      fraction of a sample or more; it opens the picture into a loop that is
      wider for higher notes, and is a property of the rig, not the pedal.
  - key: memory-verdict
    term: memory verdict
    technical: >-
      The three-way reading taken on the nonlinear loop area (of the
      compensated figure when the phase removal is accepted): memoryless-ish
      below the first threshold, memory effects at and above the second, and
      a deliberately hedged band between them, where tone filtering ahead of
      the clipper rotates every harmonic by $k$ times the drive's rotation and
      a single fundamental cannot separate that from mild memory. Both
      thresholds are literals in the shipped verdict, which the manifest reads
      by bisection.
    plain: >-
      The app's three-way call on the loop that is left once the tone filter's
      oval is taken away: small enough to be treated as no memory, large
      enough to be called memory, or in between --- where the app hedges,
      because a tone filter ahead of the clipper draws the same kind of loop
      as mild memory and one note cannot tell them apart.

  # --- Chord IMD (#306) ---------------------------------------

  - key: two-tone
    term: two-tone measurement
    technical: >-
      Chord IMD: two simultaneous sines at a musical interval, snapped to
      exact bins of the analysis window, driven through the device; the
      result is the level of every intermodulation product up to the
      seventh order, the three capture-time percentage sums, and the
      coherence detector's reads beside each tone.
    plain: >-
      The app plays two notes at once --- a power chord's fifth by default
      --- and measures every extra tone the pedal invents from the pair.

  - key: intermodulation-product
    term: intermodulation product
    symbol: $m f_1 + n f_2$
    technical: >-
      A component the nonlinearity places at $m f_1 + n f_2$ for integers
      $m, n$; its recipe is the pair $(m, n)$ and its order $|m| + |n|$ is
      the lowest polynomial power that can produce it. Read at one bin,
      exactly, and quoted in dBc re the louder played tone.
    plain: >-
      An extra tone the pedal makes from the two notes together --- a sum,
      a difference, or a combination of multiples of the two --- and the
      recipe that names which combination it is.

  - key: product-order
    term: product order
    symbol: $|m| + |n|$
    technical: >-
      The order of the recipe $(m, n)$: the polynomial power that first
      produces it. The analyzer enumerates every recipe of order two
      through seven --- 54 on a lattice with no collisions --- and a
      shared bin is kept by its lowest order.
    plain: >-
      How many multiples of the two notes go into an invented tone; the
      app lists every combination up to seven.

  - key: analysis-lattice
    term: analysis lattice
    technical: >-
      The set of bins the two tones and every product occupy: with tone
      bins $k_1 = g a$ and $k_2 = g b$ ($a : b$ coprime), the product
      $(m, n)$ lands on bin $m k_1 + n k_2$ exactly, so every lattice point
      is a multiple of $g$ and the closest two products can come is $g$
      bins. Chosen once by the ratio search and scaled to each grid.
    plain: >-
      The grid of frequency slots the two notes and all their invented
      tones land on, arranged so that no two invented tones share a slot
      or crowd each other.

  - key: reduced-ratio
    term: reduced tone ratio
    symbol: "$a : b$"
    technical: >-
      The tone bins in lowest terms. Two recipes of order at most
      $K$ can share a bin only when $a + b \le 2K$, so the probe insists
      on $a + b \ge 2K + 1$; the ratio alone fixes the delivered
      interval, whatever the rate or length. The shipped fifth is
      $109 : 163$.
    plain: >-
      The two notes' frequencies as a simplest fraction; a fraction with
      big enough numbers keeps every invented tone on its own slot.

  - key: lattice-spacing
    term: lattice spacing
    symbol: $g$
    technical: >-
      $\gcd(k_1, k_2)$: the integer combinations of the two tone bins are
      exactly the multiples of $g$ (Bézout), so no product can sit nearer
      than $g$ bins to another or to either tone. 22 bins on the shipped
      fifth at 96 and 48 kHz, 24 at 88.2 and 44.1 kHz.
    plain: >-
      How many slots apart any two invented tones must be; the probe is
      chosen so this is more than a dozen.

  - key: lattice-snap
    term: lattice snap
    technical: >-
      Placing the two tones on bin centres so that a whole number of
      cycles of each fits the window: the reduced ratio is chosen once
      against every standard grid (no collisions, spacing at or above the
      bar, both tones inside a $\pm 15$ cent budget, then the interval
      nearest the request) and scaled to the grid at hand; a grid too
      coarse for it falls back to the widest collision-free lattice in
      budget, and a request that cannot escape exact degeneracy is refused
      before anything plays.
    plain: >-
      The small, disclosed adjustment of the two notes --- a few cents ---
      that lets the analysis read every invented tone cleanly.

  - key: coherent-sampling
    term: coherent sampling
    technical: >-
      Both tones complete a whole number of cycles in the analysis window,
      so a rectangular window leaks nothing: every product sits on one bin
      and the floor beneath a record is noise, not a window's skirt. The
      premise has no margin --- a tone that drifts during the capture
      spills a $1/(\pi m)$ skirt across the lattice.
    plain: >-
      Both notes are tuned so they fit the analysis window exactly, which
      is what lets each invented tone be read cleanly in its own slot.

  - key: analysis-window
    term: analysis window
    symbol: $N$
    technical: >-
      Exactly $N$ captured samples, rectangularly windowed, starting after
      the fade-in and the settle and ending before the fade-out; $N$ is
      the longest power of two under the ceiling whose segment fits the
      steady state, and the stimulus is sized to hold it --- 2$^{21}$
      samples (21.8 s) at 96 kHz.
    plain: >-
      The long middle stretch of the recording that the analysis actually
      reads, cut so that neither the start nor the end of the notes is in
      it.

  - key: local-floor
    term: local floor
    technical: >-
      The capture-time noise estimate beside one bin: the median magnitude
      over the bins from 3 out to about $\pm 8.8$ Hz out on either side,
      with every bin the lattice claims --- products, tones, DC, the
      detector's bins --- removed by name. A product is called present when
      it stands more than four times ($12.04$ dB) above it; the verdict is
      stored and never revisited.
    plain: >-
      The noise measured right next to each invented tone, from slots
      that hold nothing else; a tone counts as present when it stands
      well above that.

  - key: capture-floor
    term: capture floor
    technical: >-
      The read-time summary of a capture's empty bins: the upper median of
      the levels of every product judged not present and not refused on
      lattice position or band, with the spread above it. It bounds what
      the capture could see and can change no product's verdict --- one
      direction, no feedback.
    plain: >-
      How deep this particular recording could see, stated under the
      table; it describes the recording and never changes a verdict.

  - key: gate
    term: presence gate
    technical: >-
      The analyzer's per-bin criterion, amplitude $> 4 \times$ the local
      floor ($20 \log_{10} 4 = 12.04$ dB), decided at capture and frozen in
      the payload as the product's \texttt{aboveFloor} flag.
    plain: >-
      The fixed bar --- four times the noise beside it --- an invented tone
      must clear to count as measured.

  - key: product-reading
    term: product reading
    technical: >-
      One of four outcomes per product, decided in a fixed order: refused on
      lattice position (beside a played tone or DC), out of band (under
      20 Hz), refused beside a louder product, refused by the analyzer's
      window or under the loudest product's skirt, then present with its
      margin over the capture floor or absent with the bin's own read as a
      bound. A refusal is never silently absent.
    plain: >-
      What the app says about each invented tone: measured, nothing found
      down to a stated level, or could not be read --- and why.

  - key: coherence-check
    term: coherence check
    technical: >-
      Whether the played tones stayed stationary across the window: the
      worst of the detector bins beside each tone, read against the local
      floor beside that tone, against a measured 30 dB bar --- interpreted
      only over the offsets where the tone's own skirt outweighs the loudest
      product's, and only as a verdict about the chain, never a culprit.
    plain: >-
      A check that neither note drifted while the recording ran; if one
      did, the whole record is smeared and the app says so rather than
      quoting numbers.

  - key: coherence-detector
    term: coherence detector
    technical: >-
      The raw spectrum at offsets $\pm 1 \ldots \pm 9$ bins beside each
      played tone, stored at capture with the local floor beside the tone;
      the widest offset is derived from the narrowest resolvable spacing
      ($13 - 1 - 3$), and every offset is read because an even-cycle wander
      lights the even ones only.
    plain: >-
      The nine slots either side of each note, kept with the record so that
      a note which drifted during the capture can be caught where its spill
      lands first.

  - key: pair-statistic
    term: sideband pair statistic
    technical: >-
      The mean of the two innermost detector bins about each tone, and the
      difference between the two tones' pairs against $20 \log_{10}(f_2 /
      f_1)$: a shared fractional frequency wander separates the pairs by
      that figure, while amplitude or frequency-independent phase
      modulation leaves them equal --- a shape the line states without a
      verdict.
    plain: >-
      The two notes' neighbouring slots compared with each other, a shape
      that hints at what kind of drift occurred without claiming to know.

  - key: harmonic-role
    term: harmonic role
    technical: >-
      The tiles' partition of the resolved products by what each does to
      the requested chord: the recipe $(m, n)$ is placed at index $m a + n
      b$ on the harmonic grid of the interval's simplest 5-limit just ratio
      $a : b$, its pitch class read off the odd part of the index; on a
      played note's class it thickens (at or above the low note) or adds a
      sub-octave; on a consonant other class it adds colour; elsewhere, or
      between frets, it clashes. Classified at the requested interval,
      measured at the lattice.
    plain: >-
      Which of five jobs an invented tone does to the chord you played:
      thickens it, adds weight below it, adds a colour that is in tune with
      the chord, clashes, or --- all together --- how much there is.

  - key: just-ratio
    term: just ratio
    technical: >-
      The simplest ratio $a : b$ with every factor 2, 3 or 5 within 20 cents
      of the requested 12-TET interval, found by search ($3 : 2$ for the
      fifth, $5 : 4$ for the major third): the harmonic grid the roles are
      placed on has fundamental $f_1 / a$, 55 Hz for A2 + E3.
    plain: >-
      The whole-number version of the interval you asked for --- three to
      two for a fifth --- which decides where each invented tone falls
      musically.

  # --- Gain Map (#306) ---------------------------------------

  - key: gain-map
    term: gain map
    technical: >-
      The level-resolved harmonic measurement (§6.2's gain journey): the
      Harmonic Distortion sweep repeated at each drive level of a lattice,
      each level analyzed on its own, and the results summarized on one
      export grid as $\mathrm{thd}[i][j]$ and $H_k[i][j]$ --- a map of the
      device's distortion against level and note.
    plain: >-
      The same test tone played at several loudnesses in turn, from quiet to
      hot, so that the distortion can be drawn as a map --- how hard the
      pedal is driven up one side, which note along the other.

  - key: drive-level
    term: drive level
    technical: >-
      The digital level of one level's sweep, $20\log_{10} A$ in dBFS, where
      $A$ is the sweep amplitude the device is driven with. On a hardware
      record it is the interface's output level; on a plugin record it is
      digital full scale itself. The lattice is a list of these.
    plain: >-
      How hard the app drives the pedal for one row of the map: the level
      of the signal going into it, as your pick and your guitar's volume
      knob would drive it. The pedal's own knobs are never touched.

  - key: level-lattice
    term: level lattice
    technical: >-
      The drive levels a journey measures, evenly spaced in dB from a floor
      to a ceiling inclusive, one sweep per level; the hardware and plugin
      windows set the two ends and the level count.
    plain: >-
      The ladder of loudnesses the map is measured at, from the quietest
      rung to the loudest in equal steps of decibels --- each rung the same
      ratio louder than the one below, not the same amount.

  - key: drive-window
    term: drive window
    technical: >-
      The floor and ceiling of the lattice. The hardware window's ceiling is
      the loudest drive that cannot clip the converter once the input is
      staged for the pedal, its floor a fixed travel below; the plugin
      window's ceiling is digital full scale (the float render path has no
      converter) and its floor is lower, where high-gain preamp knees sit.
    plain: >-
      The quietest and loudest rungs of the ladder. A real interface must not
      be driven into clipping, so its top rung is held back; a plugin has no
      converter to protect and is driven to the very top.

  - key: map-cell
    term: cell
    technical: >-
      One (level, column) of the summary grid: a THD figure over the
      declared band and one figure per stored harmonic order, each read
      from that level's own analysis at the column's fundamental.
    plain: >-
      One square of the map: one loudness, one note, and the distortion the
      pedal made there.

  - key: export-grid
    term: export grid
    technical: >-
      The summary's frequency columns: a fixed count of fundamentals
      log-spaced from the sweep's start to its end inclusive, so the first
      and last columns sit at the sweep's edges, inside its fade ramps.
    plain: >-
      The notes the map is drawn at, spaced by equal musical intervals from
      the lowest the sweep plays to the highest.

  - key: truncated-column
    term: truncated column
    technical: >-
      A column where the validity bound removed an order that the declared
      band would have counted, so its THD cells under-read their band; the
      column is flagged and excluded from the tiles, never corrected.
    plain: >-
      A column near the top of the map where some of a note's harmonics
      were too high to be measured honestly, so its distortion figure is
      known to be short and is kept out of the headline numbers.

  - key: edge-mask
    term: edge mask
    technical: >-
      The two columns that sit within a quarter tone of the grid's edges
      --- the sweep's fade-in and fade-out ramps --- masked from the tiles
      and the presence verdict; derived from the grid alone, because the
      artifact reproduces on a jumpered wire.
    plain: >-
      The first and last columns of the map, where the test tone was still
      fading in or already fading out; what they show is the test, not the
      pedal, so they are drawn faint and left out of the headline numbers.

  - key: delivered-fundamental
    term: delivered fundamental
    technical: >-
      A cell's drive level plus its stored $H_1$, in absolute dBFS. The
      journey's harmonic cells are uncompensated --- the loop's gain is in
      them --- so this is the level the fundamental actually reached at the
      converter, the quantity the floor's drive term compares against.
    plain: >-
      How loud the note itself actually arrived at the interface for one
      square of the map, with everything the loop added.

  - key: floor-stamp
    term: calibration stamp
    technical: >-
      The embedded calibration's THD-versus-frequency curve: one read of the
      loopback's own distortion-plus-noise at each of a log-spaced set of
      fundamentals, measured once at the calibration's own drive, stored in
      every record.
    plain: >-
      A note the app keeps with every measurement of how much distortion
      and noise the bare loop --- cable, interface and nothing else ---
      showed at each pitch when it was checked.

  - key: median-read
    term: median read
    technical: >-
      How the Gain Map reads the calibration stamp: each point replaced by
      the running median of its neighbours over an odd window before the
      interpolation, so a single-read trough cannot set the floor; the
      per-harmonic path reads the stamp verbatim (a window of one).
    plain: >-
      Reading the loop's noise note by taking the middle value of a few
      neighbouring pitches at once, so one unlucky reading cannot make the
      loop look quieter than it is.

  - key: drive-term
    term: drive term
    technical: >-
      The floor's adjustment for a cell delivered quieter than the
      calibration: the stamp's ratio rises by the difference, because the
      rig's noise is absolute; for a cell delivered louder it stays at the
      stamp's own ratio --- never extrapolated past what the calibration
      measured, since the rig's own distortion rises with drive.
    plain: >-
      The allowance for a square of the map being quieter than the loop
      check was: the same noise is a bigger share of a quieter note. Louder
      than the check, no allowance is given.

  - key: operative-floor
    term: operative floor
    technical: >-
      A plugin record's own noise bound: the larger of its silence render's
      rms and its A/A residual, stamped at run initiation; it enters the
      floor as an absolute dBFS bound with no chain-gain term, and governs
      where the render-path calibration is numerically silent.
    plain: >-
      For a plugin, the noise the plugin itself makes, measured before the
      run, which stands in for the loop noise a hardware rig would have.

  - key: analyzer-residue
    term: analyzer residue
    technical: >-
      The THD the shipped analyzer reads with nothing in the loop --- the
      plan's own sweep handed back as its capture --- per column of the
      record's grid, the worst over the sweep lengths the sheet offers,
      computed at read time from the record's geometry. One column above the
      sweep's start the fade-in ramp leaks coherently into the
      second-harmonic window, and a noise floor cannot see a leak that
      scales with the signal.
    plain: >-
      The small amount of distortion the analysis reports even when there is
      nothing at all in the loop --- a property of the test, worked out
      afresh for each map, and one of the things a square must stand clear
      of before it may be called a measurement.

  - key: composed-margin
    term: composed margin
    technical: >-
      A cell's THD in dB over the applicable floor, the floor being the
      larger of the rig-noise bound (the median-read stamp with its drive
      term, or the operative floor) and the analyzer residue --- the larger
      floor is the smaller margin. Nil where neither rig source is usable.
    plain: >-
      How far a square's distortion stands above the biggest of the things
      that could fake it: the loop's noise, the plugin's noise, or the
      analysis's own residue.

  - key: corroborated-peak
    term: corroborated peak
    technical: >-
      A cell that stands clear of its floor by the minimum margin AND whose
      neighbour one column either side --- the same level, a third of an
      octave away --- also stands clear; a real peak has a shoulder in
      frequency, a floor-riding read has none. Corroboration is never asked
      for in level.
    plain: >-
      A square that is clearly above the noise and whose neighbouring note
      is too. Real distortion spills onto the next note; a noise blip
      happens to one square alone.

  - key: peak-tile
    term: peak tile
    technical: >-
      The map's headline figure, in three states: the loudest corroborated
      clear cell as a peak; else the loudest unmasked cell as a bound
      (``at or below''); else, when the map's fundamental is absent, no
      percentage at all.
    plain: >-
      The map's headline number, which says one of three things: the most
      distortion the pedal clearly made; or only that it made no more than
      some small amount the rig could not see under; or that no percentage
      can be quoted at all.

  - key: cleanup-reading
    term: cleanup reading
    technical: >-
      A THD-versus-level curve read as one of three states: the interpolated
      level at which it first reaches the threshold (cleans up); at or above
      the threshold already at the quietest level (never clean, within the
      probed range); under it at every level (always clean). On a Gain Map
      it is a column's read and the tile reads the column nearest the
      Compression probe's note; on a Compression record it is the curve's
      own read, the same three states by the same rule, the top of the
      probed range never dressed up as a crossing.
    plain: >-
      Where, going up the ladder, the pedal's distortion first crosses the
      line the chart draws: a loudness if it does; ``never clean'' if it is
      over the line even at the quietest rung; ``always clean'' if it never
      reaches it.

  - key: audition-model
    term: audition model
    technical: >-
      The per-level Hammerstein fit the record carries beside the grid,
      consumed by the Hear-it panels only: no measured quantity reads it, and
      a render between two of its levels invents a bracket-shaped clipping
      the device does not have.
    plain: >-
      A separate model of the pedal at each rung of the ladder that the
      listening panels play through; none of the map's numbers come from it.

  - key: leakage-map
    term: leakage map
    technical: >-
      The parity's own instrument: the pure phantom $[1]$ --- a fundamental
      and nothing else --- through the journey's geometry, whose every
      higher-order read is the analyzer's leakage into that order's window
      at that column; the allowance every truth comparison subtracts.
    plain: >-
      A test with a perfectly clean signal, whose only distortion is what the
      analysis itself invents --- measured so that it can be allowed for
      when checking the real cases.

  # --- Compression (#306 chapter five) -------------------------------

  - key: compression-curve
    term: compression curve
    technical: >-
      The touch-response measurement (§6.3): one tone stepped through a
      lattice of input levels, and at each step the fundamental's output
      amplitude and the THD at the probe note — output level against input
      level, both in dB, with THD against level as its companion.
    plain: >-
      One note played at many loudnesses in turn, from very quiet to very
      loud, to find where the pedal starts getting louder more slowly than
      you play.

  - key: probe-grid
    term: probe grid
    technical: >-
      The lattice of input levels a compression run steps through: a
      uniform ladder in dB from a floor to a ceiling, with an optional
      fine window merged in at a denser spacing; the grid is the user's
      per run and is read from a record's own points, never assumed.
    plain: >-
      The list of loudnesses the test plays, from quietest to loudest with
      each rung the same ratio louder than the one below, and an optional
      cluster of closer steps where the user wants a closer look.

  - key: fine-window
    term: fine window
    technical: >-
      An optional span of the probe grid filled at a finer spacing
      (clamped inside the sweep, capped in count so a wide window widens
      its own spacing), merged into the uniform lattice and sorted, so a
      transition that falls between two coarse rungs gets several points.
    plain: >-
      Extra, closer-spaced loudness steps over one stretch of the range,
      for when a feature is too narrow for the ordinary spacing to show.

  - key: stepped-tone
    term: stepped tone
    technical: >-
      The stimulus: a single sine at the probe note whose amplitude steps
      through the grid, each step a settle region (with a raised-cosine
      ramp from the previous amplitude) followed by a measurement window,
      the phase continuous across steps, a final fade to zero over one ramp.
    plain: >-
      The test note itself: one pitch, held steady, climbing the loudness
      ladder one rung at a time, with a short smooth ramp between rungs.

  - key: settle-window
    term: settle region and measurement window
    technical: >-
      Each step's two parts: the settle region, in which the amplitude ramps
      to the step's value and the device's response is allowed to settle
      (not read), and the measurement window that follows, over which the
      estimator reads the tone.
    plain: >-
      Within each rung, first a short wait for the pedal to settle at the
      new loudness, then the stretch that is actually measured.

  - key: cycle-snap
    term: cycle snap
    technical: >-
      The measurement window's length rounded to a whole number of periods
      of the probe note (at least four), so the window holds an integer
      number of cycles of the fundamental and of every harmonic, and the
      one-bin estimator sees no leakage from the tone itself.
    plain: >-
      The measured stretch is trimmed to a whole number of cycles of the
      note, so the note fits it exactly and does not smear.

  - key: one-bin-estimator
    term: one-bin estimator
    technical: >-
      The amplitude reader: a Hann-windowed single-frequency DFT bin with
      the window's coherent gain compensated, $2\,|\sum x w e^{-j\omega n}| /
      \sum w$ — exact on the snapped window for a pure tone, and robust to
      the ramp's tail and to a slightly wrong latency cut.
    plain: >-
      The way the app measures how loud the note (or one of its overtones)
      is inside the measured stretch: it asks for one exact pitch and
      ignores everything else.

  - key: noise-stamp
    term: noise stamp
    technical: >-
      The rms of the capture's own silent pre-roll — the loop plus the
      device's hiss, measured in the same capture — stored on the curve as
      its noise floor; the per-step gate and the noise bound both read it,
      and no calibration stamp enters the compression floor.
    plain: >-
      How much hiss the loop and the pedal make on their own, measured in
      the silence just before the note starts and kept with the record.

  - key: noise-gate
    term: per-step noise gate
    technical: >-
      A probe step whose measurement-window rms sits within the stated
      margin of the noise stamp is excluded from the curve and counted: its
      "output level" would be the hiss, not the tone, and would flatten the
      quiet end into a phantom knee; the quietest surviving step is then
      the effective floor.
    plain: >-
      Rungs where the note is lost in the hiss are left out and
      counted, so the hiss cannot pretend to be a flat, compressed pedal.

  - key: incremental-slope
    term: incremental slope
    technical: >-
      Between consecutive points, the change in output dB per change in
      input dB: 1 is clean (one dB out per dB in), 0 is a hard limit; the
      slope arriving at each point.
    plain: >-
      How much louder the output gets for each step louder at the input: one
      for one is clean, nothing for one is a wall.

  - key: hinge-fit
    term: hinge fit
    technical: >-
      The two-segment least-squares fit of output dB against input dB:
      $y = c_0 + c_1 x + c_2\max(0, x - k)$, two lines meeting continuously
      at a breakpoint $k$ swept over a fine set of candidates between the
      second and the third-from-last probe, each candidate solved by normal
      equations with a small ridge; the best candidate's slopes are the
      pre- and post-knee slopes.
    plain: >-
      Drawing the loudness curve as two straight lines joined at a corner,
      and sliding the corner along until the two lines fit the points best.

  - key: knee
    term: knee
    technical: >-
      The breakpoint of the hinge fit, quoted as a POINT (an input level
      with a resolution) when the fit is anchored by a unity segment below
      it, or as a BOUND (at or below a level, with the probe step as its
      resolution) when the curve is already compressing at the quietest
      probe or the breakpoint sits within one probe step of the floor.
    plain: >-
      The loudness at which the pedal starts getting louder more slowly than
      you play — given as a number when the test could see it, and as "at
      or below" when the pedal was already compressing at the quietest rung.

  - key: bound-zone
    term: floor-bound zone
    technical: >-
      The first probe step above the floor: a fitted breakpoint landing in
      it cannot be anchored from below and is reported as a bound at that
      level, never as a point.
    plain: >-
      The bottom rung of the ladder: a corner found there might really lie
      lower still, so it is reported as "at or below".

  - key: resolution-band
    term: resolution band
    technical: >-
      For a point knee, the interval of candidate breakpoints whose fit
      error stays within five percent of the best; half its width is the
      knee's resolution, never finer than the candidate spacing, and it
      sets the decimals the level is displayed with.
    plain: >-
      How precisely the corner is known: the range of corner positions that
      fit the points about as well as the best one.

  - key: unity-guard
    term: unity guard
    technical: >-
      The pre-knee test: a fitted lower segment more than a stated tolerance
      under 1 dB/dB means no clean segment anchors the fit — the device is
      already compressing at the quietest probe — so the knee is a bound at
      the floor with the fitted slope quoted as evidence; the test is against
      unity, not against the compression threshold.
    plain: >-
      A check that the quiet end of the curve really is clean before a
      corner is believed; if the pedal was already squashing at the quietest
      step, the corner is reported as "at or below the quietest step".

  - key: noise-bound
    term: noise bound
    technical: >-
      The noise stamp expressed as a worst-case THD at one point,
      $\sqrt2\,\mathrm{rms}/a_1$: if every bit of the broadband noise power
      landed in the harmonic bins the THD numerator would read exactly that,
      so a read at or below it is indistinguishable from the rig; it climbs
      toward the quiet end as the fundamental shrinks.
    plain: >-
      The largest distortion reading the hiss alone could produce at each
      loudness; anything under it is the rig, not the pedal.

  - key: floor-class
    term: floor class
    technical: >-
      Each point's THD read against the applicable floor: clear (at least
      the stated margin above it — distortion), noise-dominated (above it
      but within the margin — distortion mixed with rig noise), or below
      the floor (at or under it — the read is the rig).
    plain: >-
      Whether a distortion reading is clearly the pedal, a mix of pedal and
      hiss, or just the hiss.

  - key: floor-runs
    term: floor runs
    technical: >-
      The THD trace split into maximal runs by floor class, each segment
      between adjacent points wearing the worse endpoint's class and the
      boundary points shared, so the solo and compare charts draw one
      segmentation.
    plain: >-
      The stretches of the distortion trace drawn solid, dotted or faint
      according to how far above the hiss they stand.

  - key: null-run-reference
    term: null-run reference
    technical: >-
      A loop-only control capture of the Compression kind under the same
      calibration, offered as a second floor: its added-harmonic AMPLITUDE
      (its THD times its fundamental) interpolated between its rungs and
      divided by this capture's fundamental — an absolute contribution,
      never its ratio read across — and only inside its own probed span.
    plain: >-
      A recording of the loop with nothing in it, used to say how much
      distortion the rig itself adds at each loudness, scaled to how loud
      this pedal's note actually was.

  - key: floor-source
    term: floor source
    technical: >-
      Which of the three bounds the drawn floor came from — the capture's
      own noise stamp, a null-run reference, or a plugin's stated floor —
      named only when that source actually sets the floor at some point;
      the applied floor is always the largest of the available bounds.
    plain: >-
      A label saying where the hiss line on the chart came from, so the
      reader knows which measurement they are looking at.

  - key: summed-presence
    term: summed presence reading
    technical: >-
      The fundamental-presence reading at one compression point, with the
      SUMMED harmonic content as the reference in place of the loudest
      order (the payload stores only the sum) — at most $10\log_{10}(K-1)$
      dB more eager than the per-order form, conservative in the
      refuse-to-quote direction; the majority over the points gates the
      knee, the cleanup and every quoted THD.
    plain: >-
      The check that the note itself came through, done from the one
      distortion number each rung stores; if it fails on most rungs, no
      knee, cleanup level or percentage is quoted.

