<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050"><rect width="1500" height="1050" fill="#fdfcf9"/><text x="750.0" y="40.0" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Reference Box — power subsystem wiring (batteries · DPDT · LED · star)</text><text x="750.0" y="64.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="normal">DPDT drawn from the REAR (lug side). Verify lug behaviour with the meter BEFORE soldering — toggle lug order does not follow visual intuition.</text><rect x="90" y="150" width="180" height="110" rx="8" fill="#efece0" stroke="#1a1a1a" stroke-width="2"/><text x="180.0" y="212.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Battery A</text><circle cx="135" cy="170" r="11" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="135.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">+</text><circle cx="225" cy="170" r="11" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="225.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">−</text><rect x="90" y="330" width="180" height="110" rx="8" fill="#efece0" stroke="#1a1a1a" stroke-width="2"/><text x="180.0" y="392.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">Battery B</text><circle cx="225" cy="350" r="11" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="225.0" y="355.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">+</text><circle cx="135" cy="350" r="11" fill="none" stroke="#1a1a1a" stroke-width="2"/><text x="135.0" y="355.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">−</text><text x="180.0" y="290.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="italic">mark the snaps A and B</text><path d="M 225.0 159.0 L 225.0 120.0 L 320.0 120.0 L 320.0 300.0 L 280.0 300.0" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 225.0 339.0 L 225.0 318.0 L 280.0 318.0 L 280.0 300.0" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="300" r="4" fill="#1a1a1a"/><text x="330.0" y="288.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-style="normal">CENTRE TAP = A(−) + B(+)</text><text x="330.0" y="316.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#666" font-weight="normal" font-style="normal">heat-shrink the splice</text><path d="M 280.0 300.0 L 450.0 300.0 L 450.0 960.0 L 700.0 960.0" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="740" cy="960" r="26" fill="none" stroke="#666" stroke-width="2.5"/><path d="M 740.0 960.0 L 730.1 950.1" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 749.9 950.1" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 730.1 969.9" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 749.9 969.9" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 740.0 945.7" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 740.0 974.3" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 725.7 960.0" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740.0 960.0 L 754.3 960.0" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="740.0" y="1012.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#666" font-weight="bold" font-style="normal">STAR GROUND (lid) — screw + toothed washer</text><text x="740.0" y="1028.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">centre tap lands here UNSWITCHED, its own spot on the tag stack</text><text x="430.0" y="946.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="italic">crosses the box↔lid boundary: leave lay-the-lid-flat slack</text><rect x="514" y="144" width="172" height="216" rx="10" fill="#efece0" stroke="#1a1a1a" stroke-width="2"/><text x="600.0" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">DPDT toggle (rear / lug view) — C&amp;K 7201, ON–ON</text><rect x="551" y="166" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="560" cy="180" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><rect x="551" y="238" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="560" cy="252" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><rect x="551" y="310" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="560" cy="324" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><rect x="631" y="166" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="640" cy="180" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><rect x="631" y="238" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="640" cy="252" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><rect x="631" y="310" width="18" height="28" rx="4" fill="#d8d2c0" stroke="#1a1a1a" stroke-width="1.6"/><circle cx="640" cy="324" r="4.5" fill="#fff" stroke="#1a1a1a" stroke-width="1.4"/><text x="560.0" y="166.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">pole 1</text><text x="640.0" y="166.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">pole 2</text><text x="600.0" y="220.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">row 1: feed</text><text x="600.0" y="292.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">row 2: COMMON</text><text x="600.0" y="364.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">row 3: not used</text><text x="600.0" y="385.0" font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="normal">ON = bat thrown AWAY from row 1 (typ.) — CONFIRM with meter</text><path d="M 135.0 159.0 L 135.0 100.0 L 560.0 100.0 L 560.0 180.0" stroke="#a03020" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="normal">A(+)  red</text><path d="M 135.0 339.0 L 135.0 470.0 L 470.0 470.0 L 470.0 132.0 L 640.0 132.0 L 640.0 180.0" stroke="#22488a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300.0" y="458.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" fill="#22488a" font-weight="normal" font-style="normal">B(−)  black</text><path d="M 560.0 252.0 L 500.0 252.0 L 500.0 560.0 L 1130.0 560.0" stroke="#a03020" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 640.0 252.0 L 940.0 252.0 L 940.0 600.0 L 1130.0 600.0" stroke="#22488a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="700.0" y="548.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="normal">switched +9 → board +9 rail, P6 end</text><text x="760.0" y="620.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#22488a" font-weight="normal" font-style="normal">switched −9 → board −9 rail, P6 end</text><text x="1030.0" y="662.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#a03020" font-weight="normal" font-style="italic">both cross to the lid: slack</text><rect x="1130" y="520" width="300" height="130" rx="6" fill="#f4f1e5" stroke="#666" stroke-width="1.5"/><text x="1280.0" y="505.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">SB404 — P6 end (OUT edge)</text><path d="M 1140.0 560.0 L 1200.0 560.0" stroke="#a03020" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1210.0" y="564.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#a03020" font-weight="normal" font-style="normal">+9 rail (outer)</text><path d="M 1140.0 585.0 L 1200.0 585.0" stroke="#666" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1210.0" y="589.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#666" font-weight="normal" font-style="normal">GND rail (middle) → single wire → star</text><path d="M 1140.0 600.0 L 1137.0 600.0" stroke="#22488a" stroke-width="0.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1140.0 610.0 L 1200.0 610.0" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="1210.0" y="614.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="start" fill="#666" font-weight="normal" font-style="normal">inner spare rails — unused</text><path d="M 1140.0 635.0 L 1200.0 635.0" stroke="#22488a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1210.0" y="639.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="start" fill="#22488a" font-weight="normal" font-style="normal">−9 rail (outer)</text><path d="M 1130.0 600.0 L 1140.0 600.0" stroke="#22488a" stroke-width="0.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1130.0 600.0 L 1140.0 635.0" stroke="#22488a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="820.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="bold" font-style="normal">LED indicator — taps the SWITCHED wires (box side, near the switch)</text><path d="M 500.0 560.0 L 500.0 760.0 L 720.0 760.0" stroke="#a03020" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="560" r="4" fill="#a03020"/><path d="M 720.0 760.0 L 748.0 760.0" stroke="#a03020" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 748 749 L 748 771 L 770 760 Z" fill="#1a1a1a"/><line x1="771" y1="749" x2="771" y2="771" stroke="#1a1a1a" stroke-width="2.4"/><path d="M 756.0 746.0 L 764.0 738.0" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764 738 l -1.5 4.5 l 4.5 -1.5 z" fill="#1a1a1a"/><path d="M 764.0 748.0 L 772.0 740.0" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 772 740 l -1.5 4.5 l 4.5 -1.5 z" fill="#1a1a1a"/><text x="759.0" y="792.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">LED — long lead (anode) toward +9</text><path d="M 771.0 760.0 L 800.0 760.0" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="752" width="52" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="826.0" y="746.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="normal">10 k (junk box)</text><path d="M 852.0 760.0 L 940.0 760.0" stroke="#22488a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 940.0 600.0 L 940.0 760.0" stroke="#22488a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="940" cy="600" r="4" fill="#22488a"/><text x="826.0" y="812.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">18 V across LED + 10 k → ≈1.6 mA · no ground-path current · equal drain on both batteries</text><text x="826.0" y="828.0" font-family="Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="#666" font-weight="normal" font-style="normal">mount in the bezel firing outward, leads heat-shrunk</text><rect x="70" y="532" width="360" height="330" rx="8" fill="#fff" stroke="#a03020" stroke-width="2"/><text x="90.0" y="554.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#a03020" font-weight="bold" font-style="normal">VERIFY, IN THIS ORDER</text><text x="90.0" y="578.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">1. Meter the bare switch: centre row lugs are the</text><text x="90.0" y="595.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    commons. Find the bat position that closes</text><text x="90.0" y="612.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    centre↔row-1 on BOTH poles at once; confirm</text><text x="90.0" y="629.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    pole 1 never beeps to pole 2.</text><text x="90.0" y="646.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">2. Mount switch. Wire feeds + commons as drawn.</text><text x="90.0" y="663.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    Heat-shrink every splice; Kapton between</text><text x="90.0" y="680.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    battery terminals and the chassis.</text><text x="90.0" y="697.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">3. Batteries in, switch OFF: board wire ends read</text><text x="90.0" y="714.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    0 V to centre tap.  Switch ON: +9.x and −9.x.</text><text x="90.0" y="731.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    (Fresh PP3s read 9.3–9.6 V — that is normal;</text><text x="90.0" y="748.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    record the actual values.)</text><text x="90.0" y="765.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">4. LED lights only in ON. If it is dark in ON,</text><text x="90.0" y="782.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    polarity — flip the LED, nothing is harmed.</text><text x="90.0" y="799.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">5. Only then: land +9/−9 on the board rails, then</text><text x="90.0" y="816.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    the Stage E socket-pin check (count pins from</text><text x="90.0" y="833.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    the NOTCH on the socket, not from any drawing),</text><text x="90.0" y="850.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="normal">    chips out → then seat the ICs.</text></svg>